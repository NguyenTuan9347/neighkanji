<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&display=swap');

  #krad-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 220px;
    z-index: 9999;
    box-sizing: border-box;
  }

  #krad-inner {
    height: 100%;
    background: var(--canvas-elevated, rgba(12,12,16,0.95));
    border-left: 1px solid var(--border-subtle, rgba(128,128,128,0.15));
    box-shadow: var(--shadow, -2px 0 12px rgba(0,0,0,0.15));
    padding: 12px 10px;
    font-family: var(--font-interface, system-ui, sans-serif);
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border, rgba(128,128,128,0.2)) transparent;
    box-sizing: border-box;
  }

  #krad-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  #krad-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-subtle, rgba(128,128,128,0.5));
  }

  #krad-close-btn {
    background: none;
    border: none;
    color: var(--fg-subtle, rgba(128,128,128,0.4));
    font-size: 13px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    transition: color 0.1s;
  }

  #krad-close-btn:hover { color: var(--fg, inherit); }

  #krad-cards {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .krad-card {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--canvas, rgba(128,128,128,0.06));
    border: 1px solid var(--border, rgba(128,128,128,0.15));
    border-radius: 5px;
    padding: 6px 10px;
    cursor: default;
    transition: filter 0.1s;
  }

  .krad-card:hover { filter: brightness(1.12); }

  .krad-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--fg, inherit);
    line-height: 1;
    flex-shrink: 0;
  }

  .krad-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border, rgba(128,128,128,0.15));
    flex-shrink: 0;
  }

  .krad-desc {
    font-size: 10px;
    color: var(--fg-subtle, rgba(128,128,128,0.7));
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
</style>

<div id="krad-panel">
  <div id="krad-inner">
    <div id="krad-header">
      <div id="krad-label">similar</div>
      <button id="krad-close-btn">✕</button>
    </div>
    <div id="krad-cards"></div>
  </div>
</div>
